name: Publish Package to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'biersoeckli'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js for npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package version from release tag
        run: |
          PACKAGE_VERSION=""

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            PACKAGE_VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME}"
          fi

          PACKAGE_VERSION="${PACKAGE_VERSION#v}"

          if [[ -z "${PACKAGE_VERSION}" ]]; then
            echo "Unable to determine package version. Run this workflow from a release or a tag ref."
            exit 1
          fi

          npm version "${PACKAGE_VERSION}" --no-git-tag-version --allow-same-version

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Publish to npmjs
        run: npm publish --provenance --access public
